; III.VC.SA.ModernCarCam
; Modern vehicle camera for GTA III, Vice City and San Andreas.
;
; Only setup required is picking a Profile; everything else is optional.
; On San Andreas, Game and SA use the authentic SA follow camera (with the mod's
; fixes and the smooth gamepad free-look). The Enhanced profile enables its
; features on SA too, but the SA camera always keeps its own anchor, stiffness,
; distance, FOV and angles. The III/VC-only turret and drive-by hooks are not
; installed on SA, so ModernTurretControl and ModernDriveBy do nothing there.

[General]
; Camera to use:
;   Game                             match the running game (default)
;   III / VC / SA / LCS / VCS / IV   that game's camera
;   Enhanced                         Game plus the quality-of-life extras listed below
;   Custom                           uses the [Custom] numbers below

Profile = Game

; Enhanced enables, on top of the running game's camera:
;   - Vice City's camera angles, anchor, stiffness and features
;   - elastic string physics
;   - dynamic speed FOV
;   - full pitch/terrain tilt
;   - VCS high-speed camera shake
;   - reverse look-behind camera

; Override just distance / FOV / angles (same names as Profile). Blank = follow Profile.
; Values: Game, III, VC, SA, LCS, VCS, IV, Custom.
; On SA, the Enhanced profile forces these back to SA.
DistanceProfile =
FOVProfile =
AnglesProfile =

[Features]
; Optional overrides. Comment out or delete a line to keep the value the Profile chose.

; Steering lean when turning (Vice City roll).
; Values: 0 = off, 1 = on. Off by default in the Enhanced profile on SA.
CameraWobble =

; Camera stretches on acceleration and springs back on braking.
; Values: 0 = off, 1 = on.
ElasticStringPhysics =

; Hill reaction: the camera pitches with the terrain slope.
; Values: 0 = off (flat / III), 1 = Vice City (downhill only),
;         2 = match game, 3 = both ways (full symmetric).
PitchTilt =

; Field of view widens with speed.
; Values: 0 = off, 1 = on. While this mod is installed the Widescreen Fix's
; CarSpeedDependantFOV option is forced off so this setting is authoritative.
DynamicSpeedFOV =

; Vice City Stories high-speed camera shake.
; Values: 0 = off, 1 = on. Off by default in the Enhanced profile on SA.
; While this mod is installed the Widescreen Fix's VCSCamShake option is forced
; off so this setting is authoritative.
VCSCamShake =

; Camera follow style.
; Values: 0 = loose (SA float), 1 = rigid anchor, 2 = match profile.
; The Enhanced profile on SA always uses the SA float (0).
CameraAnchoring =

; Camera catch-up speed.
; Values: -1 = match profile, 0.0 = no catch-up, larger = snappier.
; The Enhanced profile on SA always uses the SA stiffness.
CameraStiffness =

; Per-vehicle camera distances / zoom.
; Values: 0 = off, 1 = on.
VehicleSpecificZoom =

; Tank/firetruck turret follows the camera.
; Values: 0 = off, 1 = on. No effect on SA (the hook is III/VC only).
ModernTurretControl =

; 360-degree drive-by aiming.
; Values: 0 = off, 1 = on. No effect on SA (the hook is III/VC only).
ModernDriveBy =

; Mouse look around the car.
; Values: 0 = off, 1 = on.
MouseFreeLook =

; Stop the camera clipping into the car when idle.
; Values: 0 = off, 1 = on.
FixCameraClip =

; Small lean when passing traffic closely.
; Values: 0 = off, 1 = on.
TrafficCamWobble =

; Swing round to look behind after reversing for a second.
; Values: 0 = off, 1 = on. (Quality-of-life: on in Enhanced, off elsewhere
;         unless forced to 1 here.)
ReverseCamera =

; Keep the camera above water.
; Values: 0 = allow underwater, 1 = keep above water.
KeepCameraOverWater =

; Raise the camera on a bike with a passenger.
; Values: 0 = off, 1 = on.
BikesHeightIncrease =

; Extra camera height in metres on top of the profile (negative lowers it).
; Applies to every profile, including Custom (overrides CustomCameraHeight).
CameraHeight =

[Custom]
; Used when Profile = Custom. Distances in metres, angles in radians, FOV in degrees.

; Zoom distances (near / middle / far).
CustomDistanceNear = 0.05
CustomDistanceMid = 1.9
CustomDistanceFar = 3.9
; Extra distance and closest allowed.
CustomDistanceOffset = 0.0
CustomMinDistance = 10.0
; Extra camera height in metres added to the look-at point (negative lowers it).
CustomCameraHeight = 0.0

; Base field of view and speed-FOV limits.
CustomBaseFOV = 70.0
CustomMaxDynamicFOV = 30.0
CustomDynamicFOVStartSpeed = 0.4

; Camera height angle per zoom (near / middle / far).
CustomAngleNear = -0.01
CustomAngleMid = 0.045
CustomAngleFar = 0.005

; Tilt limits and side offset (negative = other side).
CustomMaxElevationAngle = 0.785398
CustomMinElevationAngle = 1.5533431
CustomLateralOffset = 0.0

; Distance multiplier for the whole camera (1.0 = table distances as-is).
CustomDistanceScale = 1.0
; Orbit target offset in car space: X = right, Y = forward, Z = up.
; Zero keeps the car centre (the GTA IV profile uses -0.32 / 0.20 / 0.30).
CustomDriverOffsetX = 0.0
CustomDriverOffsetY = 0.0
CustomDriverOffsetZ = 0.0

; ---------------------------------------------------------------------------
; Reference: the built-in profiles, for building your own with Profile = Custom.
;
; Feature flags (0 = off, 1 = on; "game" = the running game's native behaviour):
;
;   Profile    Wobble  Pitch     Dynamic  Elastic  VCSShake  Anchor  Stiffness  VehZoom  BikeHeight  Traffic  Reverse
;   Game       game    2 (match) 0        0        0         2       1.0*       game     game        0        0
;   III        0       0         0        0        0         2       1.0*       0        0           0        0
;   VC         1       1         0        0        0         2       1.0*       1        1           0        0
;   SA         0       0         0        0        0         0       0.25       1        1           0        0
;   LCS        0       0         1        0        0         0       0.40       1        1           0        0
;   VCS        0       0         1        0        1         0       0.40       1        1           0        0
;   IV         0       0         0        0        0         0       0.25       1        1           0        0
;   Enhanced   1       3         1        1        1         1       1.00       1        1           1        1
;   Custom     game    3         1        1        1         2       0.25+      game     game        1        0
;
;   * 1.0 is the authentic III/VC rigid-anchor stiffness.
;   + Custom runs the SA engine, whose default stiffness is 0.25.
;   Any value can be set directly with [Features] CameraStiffness, and every
;   flag above can be overridden in [Features] without changing the profile.
;
; Game, III and VC use the vanilla distance/angle tables; SA uses SA; LCS and
; VCS use LCS; IV uses SA; Custom uses the [Custom] numbers above. The tables
; differ per vehicle class, so the car row is given below:
;
;                    Zoom near / mid / far (car)   Angle near / mid / far (car)
;   III              0.05 / 1.9 / 3.9               see note
;   VC               -0.6 / 1.9 / 15.9              -0.01 / 0.045 / 0.005
;   SA               -1.0 / 1.0 / 6.0               0.08 / 0.07 / 0.055
;   LCS              -1.0 / 2.0 / 6.0               0.12 / 0.10 / 0.065
;
;   Those are the car (index 0) rows of the built-in tables. The GTA III
;   vanilla engine derives its height angle from the live zoom rather than a
;   table. The [Custom] keys apply one value to every vehicle class, so a
;   Custom profile approximates a built-in table rather than copying it.
;
; Other defaults: BaseFOV 70, MaxDynamicFOV 30, DynamicFOVStartSpeed 0.4,
; MaxElevationAngle 0.785398, MinElevationAngle 1.5533431, LateralOffset 0.0,
; CameraHeight 0.0, DistanceScale 1.0, DriverOffset 0/0/0. The IV profile is
; the only built-in one that changes the last two (DistanceScale 0.85,
; DriverOffset -0.32 / 0.20 / 0.30); the [Custom] keys above set all of them.
