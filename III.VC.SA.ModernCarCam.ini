; III.VC.SA.ModernCarCam
; Modern vehicle camera for GTA III, Vice City and San Andreas.
;
; Only setup required is picking a Profile; everything else is optional.
; On San Andreas, Game and SA use the authentic SA follow camera (with the mod's
; fixes and the smooth gamepad free-look). The Enhanced profile enables its
; features on SA too, but the SA camera always keeps its own anchor, stiffness,
; distance, FOV and angles. ModernTurretControl is III/VC only.

[General]
; Camera to use:
;   Game                             match the running game (default)
;   III / VC / SA / LCS / VCS / IV   that game's camera
;   Enhanced                         Game plus the quality-of-life extras listed below
;   Custom                           uses the [Custom] numbers below

Profile = Game

; Enhanced enables, on top of the running game's camera:
;   - Vice City's camera angles, anchor, stiffness and features
;   - elastic string physics
;   - dynamic speed FOV
;   - full pitch/terrain tilt
;   - VCS high-speed camera shake (also on San Andreas)
;   - a gentle traffic lean (70% of the raw effect)
;   - the smooth side view, with the drive-by lock defaults KBM = 0, JOY = 1
;   - reverse look-behind camera

; Override just distance / FOV / angles (same names as Profile). Blank = follow Profile.
; Values: Game, III, VC, SA, LCS, VCS, IV, Custom.
; On SA, the Enhanced profile forces these back to SA.
DistanceProfile =
FOVProfile =
AnglesProfile =

[Features]
; Optional overrides. Comment out or delete a line to keep the value the Profile chose.
;
; Every "effect strength" below is a MULTIPLIER:
;   1   = the profile's default (the way the feature normally behaves)
;   0   = off
;   2   = twice as strong, 0.5 = half as strong, etc.
; Remove the line (or leave it blank) to keep the profile's value.
; A negative value behaves as 0 (off).

; Steering lean when turning (Vice City roll).
CameraWobble =

; Camera stretches on acceleration and springs back on braking.
ElasticStringPhysics =

; Hill reaction: the camera pitches with the terrain slope.
; PitchTilt is the master strength for both directions. PitchTiltUphill and
; PitchTiltDownhill optionally override it per direction; when omitted they use
; the master value. Set one to 0 to disable just that direction (e.g. uphill 0
; reproduces Vice City's downhill-only tilt).
; PitchTiltMinAngle is the minimum slope, in DEGREES, before the tilt reacts at
; all (a small dead-zone so flat roads cannot jitter the camera; default 2).
; In the air the last ground tilt is held for PitchTiltAirHoldTime seconds (so
; small bumps and hops do not reset the view), then eased over
; PitchTiltAirBlendTime seconds onto the vehicle's nose so the camera lines up
; with the car while jumping.
; MaxPitch / MinPitch clamp how far the camera may pitch up / down (radians);
; leave them blank to use the profile value.
PitchTilt =
PitchTiltUphill =
PitchTiltDownhill =
PitchTiltMinAngle =
PitchTiltAirHoldTime =
PitchTiltAirBlendTime =
MaxPitch =
MinPitch =

; Field of view widens with speed.
; DynamicSpeedFOV is the strength. DynamicSpeedFOVStartSpeed is the forward
; speed (metres/tick) at which the widening starts, and DynamicSpeedFOVMaxFOV is
; the maximum number of degrees added on top of the base FOV.
; DynamicSpeedFOVDecay is the per-step decay base used to wind the FOV back down
; (smaller = snaps back faster; the game default is 0.98, the IV profile uses
; 0.90 so it returns in about half a second).
; While this mod is installed the Widescreen Fix's CarSpeedDependantFOV option
; is forced off so this setting is authoritative.
DynamicSpeedFOV =
DynamicSpeedFOVStartSpeed =
DynamicSpeedFOVMaxFOV =
DynamicSpeedFOVDecay =

; Vice City Stories high-speed camera shake.
; VCSCamShake is the strength. The VCS profile uses the full 1.0, the Enhanced
; profile uses 0.5 (a subtle touch), and any value here overrides the profile.
; VCSCamShakeStartSpeed is the speed at which the shake begins (default 0.65).
; GTA III and Vice City get a fixed 1.5x boost on top so the shake lands the same
; as it does on San Andreas; SA is left at the value above.
; While this mod is installed the Widescreen Fix's VCSCamShake option is forced
; off so this setting is authoritative.
VCSCamShake =
VCSCamShakeStartSpeed =

; Camera follow style. 0 = no anchoring (SA float), 1 = the profile's anchor,
; larger = a stronger rigid anchor (also scales the anchor catch-up).
CameraAnchoring =

; Camera catch-up speed. Multiplies the profile's default stiffness
; (1.0 for the III/VC rigid anchor, 0.25 on SA, 0.4 on LCS).
; 1 = default, 2 = twice as snappy, 0.5 = half.
CameraStiffness =

; SA follow-camera heading follow. 1 = the profile's normal follow; lower values
; make the camera hold its yaw longer and let the car swing across the view
; before swinging in behind it (higher snaps behind faster). The IV profile uses
; 0.5 on GTA III, whose follow is naturally more eager than Vice City's.
; Handy for custom profiles; 1 = default, 0.5 = half.
HeadingFollow =

; Per-vehicle camera distances / angles. 1 = full per-vehicle values,
; 0 = the generic car values, values between blend the two.
VehicleSpecificZoom =

; Tank/firetruck turret follows the camera.
; Values: 0 = off, 1 = on. No effect on SA (the hook is III/VC only).
ModernTurretControl =

; Drive-by aiming. 0 = classic (aim left/right/behind only while the look key is
; held), 1 = modern (aim where the camera is looking relative to the car).
ModernDriveBy =

; Mouse look around the car.
; Values: 0 = off, 1 = on.
MouseFreeLook =

; Stop the camera clipping into the car when idle.
; Values: 0 = off, 1 = on.
FixCameraClip =

; Small nudge when passing traffic closely. This is one short out-and-back
; impulse per vehicle actually passed (not a continuous lean), so sitting next
; to a parked car does nothing. TrafficCamWobbleMinSpeed is the forward speed
; (metres/tick, like DynamicSpeedFOVStartSpeed) below which the nudge never
; fires; the default 0.15 is roughly 27 km/h. The nudge then scales with speed:
; 1x at MinSpeed up to TrafficCamWobbleMaxMultiplier at TrafficCamWobbleFullSpeed
; (default 2x at 0.5, roughly 90 km/h). 1 = default strength, 0 = off,
; larger = stronger.
TrafficCamWobble =
TrafficCamWobbleMinSpeed =
TrafficCamWobbleFullSpeed =
TrafficCamWobbleMaxMultiplier =

; Swing round to look behind after reversing for a moment.
; ReverseCamera is 0 = off, 1 = on. ReverseCameraDelay is how many seconds of
; reversing to wait before the swing starts (default 0.25). (Quality-of-life: on
; in Enhanced, off elsewhere unless forced to 1 here.)
ReverseCamera =
ReverseCameraDelay =

; Keep the camera above water.
; Values: 0 = allow underwater, 1 = keep above water.
KeepCameraOverWater =

; Raise the camera on a bike with a passenger.
; Values: 0 = off, 1 = on.
BikesHeightIncrease =

; Look left / right / behind: swing smoothly to the new angle, or snap there.
; Values: 1 = smooth (Enhanced default), 0 = snap.
SmoothSideView =

; While a drive-by burst is being fired, keep the direction it started in, so
; looking elsewhere mid-burst does not swing the aim. Separate options for
; keyboard&mouse and gamepad aiming. Values: 1 = on (default), 0 = off.
LockShootDirectionKBM =
LockShootDirectionJOY =

; How the camera settles back behind the car after you control it with the
; mouse or right stick, and how long that takes.
; CameraReturnSpeed is a multiplier on the reversion rate (larger = snaps back
; faster); CameraReturnTime is the duration of the transition in seconds.
CameraReturnSpeed =
CameraReturnTime =

[Offsets]
; Camera offsets, applied independently of the selected Profile.
; These are added on top of whatever the profile already uses.

; Extra camera height in metres added to the look-at point (negative lowers it).
CameraHeightOffset =
; Side offset of the camera (positive = one side, negative = the other).
CameraLateralOffset =
; Extra distance in metres added to the finished camera distance.
CameraDistanceOffset =
; Closest distance the camera may come to the car. Omit to use the profile value.
CameraMinDistance =
; Distance multiplier for the whole camera (1.0 = the profile's distances).
CameraDistanceScale =
; Orbit target offset in car space: X = right, Y = forward, Z = up.
; Zero keeps the profile target (the GTA IV profile uses -0.32 / 0.20 / 0.30).
CameraDriverOffsetX =
CameraDriverOffsetY =
CameraDriverOffsetZ =

[Custom]
; Used when Profile = Custom. Distances in metres, angles in radians, FOV in degrees.

; Zoom distances (near / middle / far).
CustomDistanceNear = 0.05
CustomDistanceMid = 1.9
CustomDistanceFar = 3.9

; Base field of view. The dynamic speed-FOV limits come from [Features]
; (DynamicSpeedFOVStartSpeed / DynamicSpeedFOVMaxFOV) for every profile,
; including Custom, so they are not repeated here.
CustomBaseFOV = 70.0

; Camera height angle per zoom (near / middle / far).
CustomAngleNear = -0.01
CustomAngleMid = 0.045
CustomAngleFar = 0.005

; ---------------------------------------------------------------------------
; Reference: the built-in profiles, for building your own with Profile = Custom.
;
; Feature strengths (1 = on at default, 0 = off). Any value can be overridden
; in [Features] without changing the profile.
;
;   Profile    Wobble  Pitch            Dynamic  Elastic  VCSShake  Anchor  Stiffness  VehZoom  BikeHeight  Traffic  Reverse
;   Game/VC    1       1 (downhill)     0        0        0         1       1x*        1        1           0        0
;   Game/III   0       0                0        0        0         1       1x*        0        0           0        0
;   III        0       0                0        0        0         1       1x*        0        0           0        0
;   VC         1       1 (downhill)     0        0        0         1       1x*        1        1           0        0
;   SA         0       0                0        0        0         0       1x(0.25)   1        1           0        0
;   LCS        0       0                1        0        0         0       1x(0.40)   1        1           0        0
;   VCS        0       0                1        0        1         0       1x(0.40)   1        1           0        0
;   IV         0       0                0        0        0         0       1x(0.25)   1        1           0        0
;   Enhanced   1       1 (both ways)    1        1        1         1       1x*        1        1           1        1
;   Custom     = Game (see the two Game rows above); only the camera shape in
;              [Custom] differs. Every strength can be overridden in [Features].
;
;   On San Andreas the Enhanced profile also enables the VCS camera shake.
;
;   * With Anchor = 1 the III/VC rigid anchor uses the authentic 1.0 stiffness;
;     the Stiffness column multiplies the profile default (0.25 SA, 0.40 LCS).
;   Pitch "1 (downhill)" is PitchTiltUphill = 0 with the master at 1.
;
; Game, III and VC use the vanilla distance/angle tables; SA uses SA; LCS and
; VCS use LCS; IV uses SA; Custom uses the [Custom] numbers above. The tables
; differ per vehicle class, so the car row is given below:
;
;                    Zoom near / mid / far (car)   Angle near / mid / far (car)
;   III              0.05 / 1.9 / 3.9               see note
;   VC               -0.6 / 1.9 / 15.9              -0.01 / 0.045 / 0.005
;   SA               -1.0 / 1.0 / 6.0               0.08 / 0.07 / 0.055
;   LCS              -1.0 / 2.0 / 6.0               0.12 / 0.10 / 0.065
;
;   Those are the car (index 0) rows of the built-in tables. The GTA III
;   vanilla engine derives its height angle from the live zoom rather than a
;   table. The [Custom] keys apply one value to every vehicle class, so a
;   Custom profile approximates a built-in table rather than copying it.
;
; Other defaults: BaseFOV 70, MaxDynamicFOV 30, DynamicFOVStartSpeed 0.4,
; MaxPitch 0.785398, MinPitch 1.5533431, CameraHeightOffset 0,
; DistanceScale 1.0, DriverOffset 0/0/0. The IV profile is the only built-in one
; that changes the last two (DistanceScale 0.85, DriverOffset -0.32 / 0.20 / 0.30);
; the [Offsets] keys above change all of them for any profile.
