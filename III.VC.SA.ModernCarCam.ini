; III.VC.SA.ModernCarCam
; Modern vehicle camera for GTA III, Vice City and San Andreas.
;
; QUICK START
;   1. Set Profile in [General] below. That is all most people need.
;   2. Optionally flip the on/off switches in [Features].
;   3. For fine control, change the strengths in [Multipliers].

[General]
; Camera to use:
;   Game                             match the running game (default)
;   III / VC / SA / LCS / VCS / IV   that game's camera
;   Enhanced                         Game plus the quality-of-life extras listed below
;   Custom                           uses the [Custom] numbers below
Profile = Game

; What Enhanced adds on top of the running game's camera:
;   - Vice City's camera angles, anchor, stiffness and features
;   - elastic string physics
;   - dynamic speed FOV
;   - full pitch / terrain tilt in both directions
;   - VCS high-speed camera shake (in San Andreas - half strength)
;   - traffic cam wobble
;   - the smooth side view, with the drive-by lock defaults KBM = 0, JOY = 1
;   - reverse look-behind camera
; On San Andreas the camera keeps its own anchor and stiffness, and its own
; distance, FOV and angles unless overridden by the ADVANCED keys below. The
; Vice City steering wobble and VCS shake stay off by default.

; ADVANCED: override just distance / FOV / angles (same names as Profile).
; Blank = follow Profile. Values: Game, III, VC, SA, LCS, VCS, IV, Custom.
DistanceProfile =
FOVProfile =
AnglesProfile =

[Features]
; On/off switches. 0 = off, 1 = on, Auto = the Profile's setting.
; The strength of each effect is set in [Multipliers].

; --- Effects ---
CameraWobble = Auto          ; tilt the camera as you steer through a turn
ElasticStringPhysics = Auto  ; stretch on acceleration, spring back on braking
PitchTilt = Auto             ; tilt the camera with the slope of the ground
DynamicSpeedFOV = Auto       ; widen the field of view as you speed up
VCSCamShake = Auto           ; shake the camera a little at high speed
TrafficCamWobble = Auto      ; jolt when you pass another car closely

; --- Camera behaviour ---
CameraAnchoring = Auto       ; 1 = rigid behind the car, 0 = free float
VehicleSpecificZoom = Auto   ; 1 = each vehicle has its own zoom
BikesHeightIncrease = Auto   ; raise the camera on a bike with a passenger
KeepCameraOverWater = Auto   ; keep the camera above the water

; --- Looking around ---
MouseFreeLook = Auto         ; look around the car with the mouse
SmoothSideView = Auto        ; swing to the side view instead of snapping
ReverseCamera = Auto         ; swing behind after reversing for a moment

; --- Shooting and controls ---
ModernDriveBy = Auto         ; drive-by aims in the direction of the camera
LockShootDirectionKBM = Auto ; keep a burst aimed where it started (keyboard/mouse)
LockShootDirectionJOY = Auto ; keep a burst aimed where it started (gamepad)
ModernTurretControl = Auto   ; turret follows the camera (GTA III / VC only)

; --- Fixes ---
FixCameraClip = Auto         ; stop the camera dipping into the car

[Multipliers]
; Strength of each effect, on top of its [Features] switch.
; 1 = normal, 2 = double, 0.5 = half, Auto = the Profile's strength.

; Tilt the camera as you steer through a turn.
CameraWobble = Auto
; Pull the camera back as you accelerate and let it spring forward as you brake.
ElasticStringPhysics = Auto

; Tilt the camera up and down with the slope of the ground.
PitchTilt = Auto
;   uphill strength (Auto uses PitchTilt's multiplier)
PitchTiltUphill = Auto
;   downhill strength (Auto uses PitchTilt's multiplier)
PitchTiltDownhill = Auto
;   degrees; slopes shallower than this do not tilt the camera
PitchTiltMinAngle = Auto
;   seconds the last ground tilt is held while airborne
PitchTiltAirHoldTime = Auto
;   seconds to ease onto the car's nose while airborne
PitchTiltAirBlendTime = Auto
;   degrees; how far the camera may pitch up
MaxPitch = Auto
;   degrees; how far the camera may pitch down
MinPitch = Auto

; Widen the view as you speed up.
DynamicSpeedFOV = Auto
;   km/h; speed where the widening starts
DynamicSpeedFOVStartSpeed = Auto
;   degrees added on top of the base field of view at full speed
DynamicSpeedFOVMaxFOV = Auto
;   wind-down per step; smaller returns to normal faster
DynamicSpeedFOVDecay = Auto

; Shake the camera a little at high speed.
VCSCamShake = Auto
;   km/h; speed where the shake begins
VCSCamShakeStartSpeed = Auto

; One short jolt when you pass another car closely
TrafficCamWobble = Auto
;   km/h; speed below which it never fires
TrafficCamWobbleMinSpeed = Auto
;   km/h; speed at which it reaches full strength
TrafficCamWobbleFullSpeed = Auto
;   strength reached at full speed (multiplier)
TrafficCamWobbleMaxMultiplier = Auto

; --- Camera behaviour ---
; How strongly the camera is anchored (0 = free float).
CameraAnchoring = Auto
; Catch-up speed; 1 = normal, 2 = snappier, 0.5 = looser.
CameraStiffness = Auto
; How eagerly the camera swings behind the car (lower holds the view longer).
HeadingFollow = Auto
; Per-vehicle zoom strength (0 = one zoom for all vehicles).
VehicleSpecificZoom = Auto
; Seconds of reversing before the look-behind camera starts.
ReverseCameraDelay = Auto
; How fast the camera returns after free-look (1 = normal, 2 = faster).
CameraReturnSpeed = Auto
; Seconds the free-look return takes.
CameraReturnTime = Auto

[Offsets]
; Camera offsets, applied on top of any Profile. Distances in metres.

; Extra camera height added to the look-at point (negative lowers it).
CameraHeightOffset =
; Side offset of the camera (positive = one side, negative = the other).
CameraLateralOffset =
; Extra distance added to the finished camera distance.
CameraDistanceOffset =
; Closest distance the camera may come to the car. Omit to use the profile value.
CameraMinDistance =
; Distance multiplier for the whole camera (1.0 = the profile's distances).
CameraDistanceScale =
; Orbit target offset in car space: X = right, Y = forward, Z = up.
; Zero keeps the profile target (the GTA IV profile uses -0.32 / 0.20 / 0.30).
CameraDriverOffsetX =
CameraDriverOffsetY =
CameraDriverOffsetZ =

[Custom]
; Used when Profile = Custom. Distances in metres; angles and base FOV in degrees.

; Zoom distances (near / middle / far).
CustomDistanceNear = 0.05
CustomDistanceMid = 1.9
CustomDistanceFar = 3.9

; Base field of view. The dynamic speed-FOV limits come from [Multipliers]
; (DynamicSpeedFOVStartSpeed / DynamicSpeedFOVMaxFOV) for every profile,
; including Custom, so they are not repeated here.
CustomBaseFOV = 70.0

; Camera height angle per zoom (near / middle / far).
CustomAngleNear = -0.57
CustomAngleMid = 2.58
CustomAngleFar = 0.29

; ---------------------------------------------------------------------------
; Reference: the built-in profiles, for building your own with Profile = Custom.
;
; Feature strengths (1 = on at default, 0 = off). Any value can be overridden
; in [Features] (on/off) and [Multipliers] (strength) without changing the profile.
;
;   Profile    Wobble  Pitch            Dynamic  Elastic  VCSShake  Anchor  Stiffness  VehZoom  BikeHeight  Traffic  Reverse
;   III        0       1 (downhill)     0        0        0         1       1x        0        0           0        0
;   VC         1       1 (downhill)     0        0        0         1       1x        1        1           0        0
;   SA         0       0                0        0        0         0       0.25x     1        1           0        0
;   LCS        0       0                1        0        0         0       0.40x     1        1           0        0
;   VCS        0       0                1        0        1         0       0.40x     1        1           0        0
;   IV         0       0                0        0        0         0       0.25x     1        1           0        0
;   Enhanced   1       1 (both ways)    1        1        1         1       1x        1        1           1        1
;   Custom     = Game (see the two Game rows above); only the camera shape in
;              [Custom] differs. Every strength can be overridden in [Features]
;              and [Multipliers].
;
; Game, III and VC use the vanilla distance/angle tables; SA uses SA; LCS and
; VCS use LCS; IV uses SA; Custom uses the [Custom] numbers above. The tables
; differ per vehicle class, so the car row is given below:
;
;                    Zoom near / mid / far (car)   Angle near / mid / far (car)
;   III              0.05 / 1.9 / 3.9               see note
;   VC               -0.6 / 1.9 / 15.9              -0.01 / 0.045 / 0.005
;   SA               -1.0 / 1.0 / 6.0               0.08 / 0.07 / 0.055
;   LCS              -1.0 / 2.0 / 6.0               0.12 / 0.10 / 0.065
;
;   Those are the car (index 0) rows of the built-in tables. The GTA III
;   vanilla engine derives its height angle from the live zoom rather than a
;   table. The [Custom] keys apply one value to every vehicle class, so a
;   Custom profile approximates a built-in table rather than copying it.
;
; Other defaults: BaseFOV 70, MaxDynamicFOV 30, DynamicFOVStartSpeed 0.4,
; MaxPitch 45 degrees, MinPitch 89 degrees, CameraHeightOffset 0,
; DistanceScale 1.0, DriverOffset 0/0/0. The IV profile is the only built-in one
; that changes the last two (DistanceScale 0.85, DriverOffset -0.32 / 0.20 / 0.30);
; the [Offsets] keys above change all of them for any profile.
