; ModernCarCam Configuration File
; Universal ASI for Grand Theft Auto III and Grand Theft Auto: Vice City

[General]
; Master camera profile: SA, LCS, Vanilla, or Custom (default: Vanilla)
; Sets the default profile for distance, FOV, and angles if not overridden individually below.
; SA      = San Andreas camera distance, FOV, and angles
; LCS     = Liberty City Stories camera distance, FOV, and angles
; Vanilla = Original GTA III / Vice City camera distance, FOV, and angles
; Custom  = Use custom numeric values specified in [CustomProfile] below
CameraProfile = Vanilla

; Independent profile settings (options: SA, LCS, Vanilla, Custom, or leave blank to follow CameraProfile)
; Distance profile: controls camera distance and zoom presets
DistanceProfile = Vanilla

; FOV profile: controls field of view behavior and dynamic speed FOV expansion
FOVProfile = Vanilla

; Angles profile: controls pitch and elevation angles
AnglesProfile = Vanilla

[Features]
; Authentic steering wobble & roll tilt when steering left or right while camera is idle
; (1 = enabled, 0 = disabled, 2 = match game [enabled in VC, disabled in III])
CameraWobble = 1

; Elastic "string" physics: distance stretches during acceleration, catches up on braking, spring lag
; (1 = enabled, 0 = disabled)
ElasticStringPhysics = 1

; Terrain slope pitch tilt: smoothly tilts camera up/down when driving on hills/slopes
; (1 = enabled, 0 = disabled, 2 = match game [enabled in VC, disabled in III])
PitchTilt = 1

; Dynamic speed FOV: expands field of view as vehicle speed increases
; (1 = enabled, 0 = disabled)
DynamicSpeedFOV = 0

; VCS camera shake: high-speed camera shake effect like in GTA Vice City Stories (borrowed from ThirteenAG's WidescreenFix)
; (1 = enabled, 0 = disabled)
VCSCamShake = 0

; Camera anchoring: replicates the authentic vanilla III/VC rigid tether behind the car body orientation
; 0 = disabled (San Andreas loose momentum tracking)
; 1 = enabled (authentic GTA III / VC rigid anchor behind vehicle)
; 2 = match profile (enabled for Vanilla profile, disabled for SA/LCS)
CameraAnchoring = 2

; Camera stiffness: controls responsiveness when tracking the vehicle (-1.0 = match profile: 1.0 for Vanilla, 0.4 for LCS, 0.25 for SA)
CameraStiffness = -1.0

; Vehicle-specific zoom scaling: different camera distances per vehicle type (cars, bikes, boats, helis, etc.)
; (1 = enabled, 0 = disabled, 2 = match game [enabled in VC, disabled in III])
; If disabled, vanilla uniform zoom scaling is preserved
VehicleSpecificZoom = 1

; Modern turret control: Rhino tank turret and Firetruck cannon aim where the camera looks
; (1 = enabled, 0 = disabled)
; If disabled, original tank/firetruck turret controls are preserved
ModernTurretControl = 1

; Modern drive-by: 360-degree free drive-by aiming based on camera orientation
; (1 = enabled, 0 = disabled)
; If disabled, vanilla drive-by controls (strict left/right keys) are preserved
ModernDriveBy = 1

; Mouse free-look: orbit the camera around the vehicle using the mouse while driving
; (1 = enabled, 0 = disabled)
MouseFreeLook = 1

; Fix camera clipping through vehicle model when stationary
; (1 = enabled, 0 = disabled)
FixCameraClip = 1

; Prevent camera from dipping underwater
; (1 = enabled, 0 = disabled)
KeepCameraOverWater = 1

; Bike camera raises slightly when carrying a passenger
; (1 = enabled, 0 = disabled, 2 = match game [enabled in VC, disabled in III])
BikesHeightIncrease = 1

[CustomProfile]
; Fine-tune camera parameters when DistanceProfile, FOVProfile, AnglesProfile, or CameraProfile is set to Custom

; Camera distance presets for near, mid, and far zoom modes
CustomDistanceNear = 0.05
CustomDistanceMid = 1.9
CustomDistanceFar = 3.9
CustomDistanceOffset = 0.0
CustomMinDistance = 10.0

; Base FOV and dynamic speed FOV expansion settings
CustomBaseFOV = 70.0
CustomMaxDynamicFOV = 30.0
CustomDynamicFOVStartSpeed = 0.4

; Elevation and pitch angle presets
CustomAngleNear = 0.05
CustomAngleMid = 0.10
CustomAngleFar = 0.02
CustomMaxElevationAngle = 0.785398
CustomMinElevationAngle = 1.5533431
