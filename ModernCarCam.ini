; III.VC.ModernCarCam
; A modern vehicle camera system for GTA III and GTA Vice City.
;
; HOW THIS WORKS
; --------------
; Everything is chosen by one setting: Profile. It decides which game's camera
; the mod reproduces. A few profiles (Enhanced, Custom) also turn on optional
; extras. You never have to edit anything below unless you want to.
;
; The Game-Matched, III, VC and SA profiles reproduce the original camera and
; add ONLY the free camera (mouse look), free turret control and bug fixes.
; Everything else is off in those profiles; turn an option on in [Features]
; if you want it.

[General]
; Which camera to use.
;
;   Game-Matched  Use whatever game is running (GTA III or Vice City). Default.
;   III           Always use the GTA III camera.
;   VC            Always use the Vice City camera.
;   SA            Use the San Andreas "follow" camera (loose, momentum based).
;   Enhanced      Game-Matched plus: elastic string, speed FOV, full pitch tilt
;                 and the Vice City Stories camera shake. A nicer-than-vanilla
;                 camera that still feels like the original.
;   LCS           Use the Liberty City Stories camera.
;   VCS           Use the Vice City Stories camera (includes the high-speed shake).
;   IV            Use the GTA IV camera style.
;   V             Use the GTA V camera style.
;   Custom        Everything below in [Custom] is used, so you can dial in every
;                 number by hand.
Profile = Game-Matched

[Features]
; Optional switches. They all use the same values:
;   0 = off, 1 = on.  Leave a line commented out (or delete it) to keep the
; value that the chosen Profile already gives you.
;
; CameraWobble         The camera leans/rolls a little when you steer, like
;                      real steering inertia. (Vice City has this; GTA III does not.)
; ElasticStringPhysics The camera distance stretches when you accelerate and
;                      springs back when you brake. A more lively string.
; PitchTilt            How the camera reacts to hills.
;                      0 = always level (GTA III style)
;                      1 = tilts down on slopes (Vice City style)
;                      2 = match the running game (default for game profiles)
;                      3 = full smooth tilt both uphill and downhill
; DynamicSpeedFOV      Widens the field of view as you go faster, so speed feels
;                      faster. Ported from the Widescreen Fix.
; VCSCamShake          Adds the Vice City Stories high-speed camera shake.
; CameraAnchoring      How tightly the camera follows the car.
;                      0 = loose, momentum based (San Andreas)
;                      1 = rigidly anchored behind the car (GTA III / Vice City)
;                      2 = match the chosen profile (default)
; CameraStiffness      How quickly the camera catches up when it returns behind
;                      the car. Higher = snappier, lower = floatier.
;                      -1 = match the chosen profile.
; VehicleSpecificZoom  Bikes, boats, helicopters etc. get their own camera
;                      distance, like later games.
; ModernTurretControl  On the Rhino tank and Firetruck, the turret/cannon aims
;                      wherever the camera is pointing.
; ModernDriveBy        Lets you shoot 360 degrees around the car, aiming where
;                      the camera looks (instead of only left/right).
; MouseFreeLook        Lets you move the mouse to look around the car freely.
; FixCameraClip        Stops the camera popping inside the car model when idle.
; KeepCameraOverWater  Stops the camera dipping below the water surface.
; BikesHeightIncrease  Raises the camera a little when you carry a passenger on
;                      a bike.
;
; CameraWobble =
; ElasticStringPhysics =
; PitchTilt =
; DynamicSpeedFOV =
; VCSCamShake =
; CameraAnchoring =
; CameraStiffness =
; VehicleSpecificZoom =
; ModernTurretControl =
; ModernDriveBy =
; MouseFreeLook =
; FixCameraClip =
; KeepCameraOverWater =
; BikesHeightIncrease =

[Custom]
; Used when Profile = Custom. Every number here shapes the camera directly.
; All distances are in metres, angles are in radians, FOV is in degrees.

; Camera distance at each zoom level (near / middle / far).
CustomDistanceNear = 0.05
CustomDistanceMid = 1.9
CustomDistanceFar = 3.9

; Extra distance added on top of the above, and the closest the camera may sit.
CustomDistanceOffset = 0.0
CustomMinDistance = 10.0

; Field of view (degrees) and how far the speed FOV may widen it.
CustomBaseFOV = 70.0
CustomMaxDynamicFOV = 30.0
CustomDynamicFOVStartSpeed = 0.4

; Camera height angle at each zoom level (near / middle / far).
CustomAngleNear = -0.01
CustomAngleMid = 0.045
CustomAngleFar = 0.005

; How far up and down the camera may tilt, in radians.
CustomMaxElevationAngle = 0.785398
CustomMinElevationAngle = 1.5533431
