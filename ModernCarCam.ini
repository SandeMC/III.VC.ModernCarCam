; ModernCarCam Configuration File
; Universal ASI for Grand Theft Auto III and Grand Theft Auto: Vice City

[General]
; Camera profile: SA or LCS (default: SA)
; SA  = San Andreas camera distance, FOV, and angles
; LCS = Liberty City Stories camera distance, FOV, and angles
; If left blank, the profile is automatically chosen based on the ASI file name:
;   LCSCarCam.asi -> LCS profile
;   ModernCarCam.asi / SACarCam.asi -> SA profile
CameraProfile = SA

[Features]
; Authentic steering wobble & roll tilt when steering left or right while camera is idle (1 = enabled, 0 = disabled)
CameraWobble = 1

; Elastic "string" physics: distance stretches during acceleration, catches up on braking, spring lag (1 = enabled, 0 = disabled)
ElasticStringPhysics = 1

; Terrain slope pitch tilt: smoothly tilts camera up/down when driving on hills/slopes (1 = enabled, 0 = disabled)
PitchTilt = 1

; Dynamic speed FOV: expands field of view as vehicle speed increases (1 = enabled, 0 = disabled)
DynamicSpeedFOV = 1

; Vehicle-specific zoom scaling: different camera distances per vehicle type (cars, bikes, boats, helis, etc.) (1 = enabled, 0 = disabled)
; If disabled, vanilla uniform zoom scaling is preserved
VehicleSpecificZoom = 1

; Modern turret control: Rhino tank turret and Firetruck cannon aim where the camera looks (1 = enabled, 0 = disabled)
; If disabled, original tank/firetruck turret controls are preserved
ModernTurretControl = 1

; Modern drive-by: 360-degree free drive-by aiming based on camera orientation (1 = enabled, 0 = disabled)
; If disabled, vanilla drive-by controls (strict left/right keys) are preserved
ModernDriveBy = 1

; Mouse free-look: orbit the camera around the vehicle using the mouse while driving (1 = enabled, 0 = disabled)
MouseFreeLook = 1

; Fix camera clipping through vehicle model when stationary (1 = enabled, 0 = disabled)
FixCameraClip = 1

; Prevent camera from dipping underwater (1 = enabled, 0 = disabled)
KeepCameraOverWater = 1

; Auto-adjust camera zoom for widescreen displays (1 = enabled, 0 = disabled, -1 = auto by profile)
ZoomOnWidescreen = -1

; Bike camera raises slightly when carrying a passenger (1 = enabled, 0 = disabled, -1 = auto by profile)
BikesHeightIncrease = -1
